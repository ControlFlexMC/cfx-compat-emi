pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'FabricMC'
            url = 'https://maven.fabricmc.net/'
        }
    }

    plugins {
        // EMI's Fabric artifacts are built with Loom 1.7.x; older Loom refuses to configure.
        id 'fabric-loom' version '1.7-SNAPSHOT'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// 1.21.1 has no Forge: this branch is Fabric only (ControlFlex itself also ships NeoForge,
// but the NeoForge port is a separate piece of work).
include 'fabric'

rootProject.name = 'cfx-compat-emi'
