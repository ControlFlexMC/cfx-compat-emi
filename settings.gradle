pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'FabricMC'
            url = 'https://maven.fabricmc.net/'
        }
    }

    plugins {
        id 'fabric-loom' version '1.7-SNAPSHOT'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// EMI never shipped a Forge build for 1.18.2 (every 1.18.2 release is fabric/quilt), so this
// branch is Fabric only — a Forge jar here could not run: the bridge hard-depends on EMI.
include 'fabric'

rootProject.name = 'cfx-compat-emi'
