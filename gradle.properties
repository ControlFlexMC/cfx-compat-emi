org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Gradle 8.8 cannot run on a JDK newer than 22. If your default JAVA_HOME is newer, export
# JAVA_HOME=<a 17–22 JDK> before invoking the wrapper. (Not pinned here: an absolute path in
# the committed file breaks every machine that does not have it.)

# Mod (shared by both loader subprojects)
mod_id=cfx_compat_emi
mod_version=0.8.8
mod_name=Control Flex x EMI
mod_authors=ifels
mod_license=MIT
mod_description=EMI action bridge for ControlFlex
maven_group=com.ifels

# Minecraft / loaders
minecraft_version=1.19.2
minecraft_version_range=[1.19.2,1.19.3)
forge_version=43.2.0
forge_version_range=[43,)
loader_version_range=[41,)
fabric_loader_version=0.14.21
fabric_api_version=0.77.0+1.19.2
java_version=17

# Runtime dependency mod ids (provided at runtime)
controlflex_mod_id=controlflex
# Forge mods.toml uses Maven ranges; Fabric's loader has no bracket ranges — it parses
# "[0.8.8,)" as a literal version string and then fails equality, so Fabric gets ">=".
controlflex_version_range=[0.8.8,)
controlflex_version_range_fabric=>=0.8.8
emi_mod_id=emi

# EMI version (published as <mod_version>+<minecraft_version>).
# 1.0.9 is the last release with a 1.19.2 build.
emi_version=1.0.9+1.19.2
emi_version_range=>=1.0.9
emi_version_range_forge=[1.0.9,)

# ControlFlex API (plain Java, loader-agnostic), resolved from JitPack
controlflex_api_version=0.9.2
