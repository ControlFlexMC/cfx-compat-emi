org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Gradle 8.8 cannot run on a JDK newer than 22. If your default JAVA_HOME is newer, export
# JAVA_HOME=<a supported JDK> before invoking the wrapper. (Not pinned here: an absolute path
# in the committed file breaks every machine that does not have it.)

# Mod
mod_id=cfx_compat_emi
mod_version=0.1.0
mod_name=Control Flex x EMI
mod_authors=ifels
mod_license=MIT
mod_description=EMI action bridge for ControlFlex
maven_group=com.ifels

# Minecraft / loaders (1.21.1: Fabric + NeoForge; there is no Forge for 1.21)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
fabric_loader_version=0.19.5
# Metadata floor, not the dev loader (users may run anything ControlFlex accepts).
fabric_loader_min=>=0.16.0
fabric_api_min=>=0.101.2+1.21.1
fabric_api_version=0.116.17+1.21.1
neoforge_version=21.1.265
neoforge_version_range=[21.1,)
# FML version shipped with NeoForge 21.1.
neoforge_loader_range=[4,)
java_version=21

# Runtime dependency mod ids (provided at runtime).
# Fabric's loader has no Maven bracket ranges: "[0.8.8,)" is parsed as a literal version and
# then compared for equality, so Fabric metadata must use ">=".
controlflex_mod_id=controlflex
controlflex_version_range=>=0.8.8
emi_mod_id=emi

# EMI version (published as <mod_version>+<minecraft_version>)
emi_version=1.1.24+1.21.1
emi_version_range=>=1.1.0

# ControlFlex API (plain Java, loader-agnostic), resolved from JitPack
controlflex_api_version=0.9.2

# NeoForge's mods.toml takes Maven ranges (the Fabric-style ">=" strings above are invalid there).
controlflex_version_range_neoforge=[0.8.8,)
emi_version_range_neoforge=[1.1.0,)
