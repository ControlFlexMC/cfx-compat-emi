org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Gradle 8.8 cannot run on a JDK newer than 22 (this machine defaults to 25), so the
# daemon is pinned to a JDK it supports. Each subproject pins its own Java 17 compile
# toolchain independently. Remove this line on CI, where setup-java provides the JDK.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/microsoft-21.jdk/Contents/Home

# Mod (shared by both loader subprojects)
mod_id=cfx_compat_emi
mod_version=0.1.0
mod_name=Control Flex x EMI
mod_authors=ifels
mod_license=MIT
mod_description=EMI action bridge for ControlFlex
maven_group=com.ifels

# Minecraft / loaders
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=47.2.0
forge_version_range=[47,)
loader_version_range=[47,)
fabric_loader_version=0.15.7
fabric_api_version=0.83.0+1.20.1
java_version=17

# Runtime dependency mod ids (provided at runtime)
controlflex_mod_id=controlflex
controlflex_version_range=[0.8.9,)
emi_mod_id=emi

# EMI version (published as <mod_version>+<minecraft_version>)
emi_version=1.1.24+1.20.1
emi_version_range=[1.1.0,)

# ControlFlex API (plain Java, loader-agnostic), resolved from JitPack
controlflex_api_version=0.9.2
