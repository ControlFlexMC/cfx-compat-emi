modLoader = "javafml"
loaderVersion = "${neoforge_loader_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/ControlFlexMC/cfx-compat-emi/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "neoforge"
mandatory = true
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "${controlflex_mod_id}"
mandatory = true
versionRange = "${controlflex_version_range_neoforge}"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "${emi_mod_id}"
mandatory = true
versionRange = "${emi_version_range_neoforge}"
ordering = "AFTER"
side = "CLIENT"
