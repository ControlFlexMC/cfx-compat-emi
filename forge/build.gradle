plugins {
    id 'net.neoforged.moddev.legacyforge'
}

base {
    archivesName = 'cfx-compat-emi'
}

version = "${mod_version}-mc${minecraft_version}-forge"
group = maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// The shared bridge lives in common/. Tests sit beside the loader but exercise that
// shared code, so they reuse main's output instead of recompiling common/.
sourceSets {
    main {
        java.srcDir(rootProject.file('common/src/main/java'))
        resources.srcDir(rootProject.file('common/src/main/resources'))
    }
    test {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://jitpack.io' }
    // EMI publishes its artifacts here.
    maven {
        name = 'Sleeping Town'
        url = 'https://repo.sleeping.town/'
    }
}

dependencies {
    // ControlFlex API (plain Java, loader-agnostic), resolved from JitPack.
    compileOnly "com.github.ControlFlexMC:control-flex-api:${controlflex_api_version}"
    // EMI, mojmap build (the same class names the Forge runtime sees).
    compileOnly "dev.emi:emi-xplat-mojmap:${emi_version}"
    // The plugin test needs the API on the test classpath too.
    testImplementation "com.github.ControlFlexMC:control-flex-api:${controlflex_api_version}"
    // …and an SLF4J API for the plugin's logger (the game provides the binding at runtime).
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

processResources {
    def expandProps = [
        'mod_id'                  : mod_id,
        'mod_name'                : mod_name,
        'mod_version'             : mod_version,
        'mod_authors'             : mod_authors,
        'mod_license'             : mod_license,
        'mod_description'         : mod_description,
        'minecraft_version'       : minecraft_version,
        'minecraft_version_range' : minecraft_version_range,
        'forge_version_range'     : forge_version_range,
        'loader_version_range'    : loader_version_range,
        'controlflex_mod_id'      : controlflex_mod_id,
        'controlflex_version_range': controlflex_version_range,
        'emi_mod_id'              : emi_mod_id,
    ]

    filesMatching(['pack.mcmeta', 'META-INF/mods.toml']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

jar {
    from(rootProject.file('LICENSE')) { rename { "${it}_${mod_id}" } }
    finalizedBy 'reobfJar'
}
